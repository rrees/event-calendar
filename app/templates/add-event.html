{% extends 'default.html' %}

{% block title %}Add event{% endblock %}

{% block content %}

<div class="container">
	<h1>Add event</h1>

	<form>
		<div class="form-group mb-2">
			<label for="name">Name</label>
			<input type="text"
			id="name"
			name="name"
			class="form-control"/>
		</div>
		<div class="row mb-2">
			<div class="col">
				<div class="form-group">
					<label for="start_date">Starting date</label>
					<input type="date"
					id="start_date"
					name="start_date"
					class="form-control"/>
				</div>
			</div>
			<div class="col">
				<label for="end_date">Finishing date</label>
				<input type="date"
				id="end_date"
				name="end_date"
				class="form-control"/>
			</div>
		</div>
		<div class="form-group mb-2">
			<label for="url">URL</label>
			<input type="text"
			id="url"
			name="url"
			class="form-control"/>
		</div>
		<div class="form-group mb-2">
			<label for="notes">Notes</label>
			<textarea
			id="notes"
			name="notes"
			class="form-control"
			cols="3"></textarea>
		</div>
		<button type="submit" class="btn btn-primary">Add</button>
	</form>
</div>

{% endblock %}
